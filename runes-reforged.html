<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <link rel="stylesheet" href="style.css" type="text/css" />
        <title>Legacy LoL Runes Reforged Calculator</title>
    </head>
    <body>
        <header class="legacy-header">
            <div class="header-title">Legacy LoL Calculator</div>
            <nav class="header-tabs">
                <a class="header-tab" href="index.html">Masteries</a>
                <a class="header-tab" href="runes.html">Runes</a>
                <a class="header-tab active" href="runes-reforged.html">Runes Reforged</a>
            </nav>
            <div class="header-right">
                <label class="header-select-label">Season<select id="reforged-season-select" class="lol-select"></select></label>
                <label class="header-select-label">Patch<select id="reforged-patch-select" class="lol-select"></select></label>
                <a id="reforged-export-link" href="#" title="Direct link to this rune page">Link</a>
                <button id="reforged-share" class="header-action-btn" type="button" title="Copy shareable URL to clipboard">Share</button>
            </div>
            <div id="reforged-toast" role="status" aria-live="polite"></div>
        </header>

        <div id="reforged-calculator">
            <div class="reforged-loading">Loading runes catalog…</div>
            <div class="reforged-page" hidden="hidden">
                <!-- Two-column layout: primary path on the left, secondary
                     path on the right, with shards spanning across the
                     bottom. Renders dynamically from runesReforged.json. -->
                <section class="reforged-column reforged-primary">
                    <header class="reforged-col-header">
                        <div class="reforged-col-label">Primary Path</div>
                        <div class="reforged-path-strip" id="reforged-primary-strip"></div>
                    </header>
                    <div class="reforged-slots" id="reforged-primary-slots"></div>
                </section>
                <section class="reforged-column reforged-secondary">
                    <header class="reforged-col-header">
                        <div class="reforged-col-label">Secondary Path</div>
                        <div class="reforged-path-strip" id="reforged-secondary-strip"></div>
                    </header>
                    <div class="reforged-slots" id="reforged-secondary-slots"></div>
                    <div class="reforged-shards" id="reforged-shards"></div>
                </section>
            </div>
        </div>

        <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/1.7.0/jquery.min.js"></script>
        <script type="text/javascript" src="nav.js"></script>
        <script type="text/javascript" src="runes-reforged-data.js"></script>
        <script type="text/javascript" src="runes-reforged.js"></script>
    </body>
</html>
